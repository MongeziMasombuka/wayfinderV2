<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><title>Admin - Grand Atrium Full</title><style>*{box-sizing:border-box;}body{font-family:system-ui;background:#F7F4EF;padding:20px;}.container{max-width:1200px;margin:0 auto;}h1{margin-bottom:20px;}.card{background:white;border-radius:16px;padding:20px;margin-bottom:24px;box-shadow:0 2px 8px rgba(0,0,0,0.1);}.form-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;margin-bottom:20px;}input,select{padding:10px;border:1px solid #E0D9CE;border-radius:8px;font-size:14px;}button{background:#1A1612;color:white;border:none;padding:10px 20px;border-radius:8px;cursor:pointer;font-weight:600;}button:hover{background:#2A2420;}table{width:100%;border-collapse:collapse;background:white;border-radius:12px;overflow:hidden;}th,td{padding:12px;text-align:left;border-bottom:1px solid #E0D9CE;}th{background:#F0EDE6;}.actions button{padding:4px 10px;margin-right:6px;font-size:12px;}.edit-btn{background:#8B6914;}.delete-btn{background:#6E2A2A;}.search{margin-bottom:16px;padding:10px;width:300px;}.tabs{display:flex;gap:10px;margin-bottom:20px;}.tab{background:#E0D9CE;padding:8px 16px;border-radius:8px;cursor:pointer;}.tab.active{background:#1A1612;color:white;}.tab-content{display:none;}.tab-content.active{display:block;}</style></head>
<body><div class="container"><h1>🏛 Grand Atrium Admin Panel</h1><div class="tabs"><div class="tab active" onclick="showTab('stores')">Stores</div><div class="tab" onclick="showTab('categories')">Categories</div><div class="tab" onclick="showTab('wings')">Wings</div><div class="tab" onclick="showTab('amenities')">Amenities</div><div class="tab" onclick="showTab('events')">Events</div></div><div id="stores-tab" class="tab-content active"><div class="card"><h3>Add / Edit Store</h3><form id="storeForm"><div class="form-grid"><input type="text" id="store_id" placeholder="Store ID" required><input type="text" id="store_name" placeholder="Store Name" required><select id="category_id" required><option value="">Category</option></select><select id="level_id" required><option value="1">Level 1</option><option value="2">Level 2</option></select><select id="wing_id" required><option value="">Wing</option></select><input type="text" id="emoji" placeholder="Emoji" required><input type="text" id="cc" placeholder="Chip class"><input type="color" id="ibg" value="#FDF8EE"><input type="text" id="store_description" placeholder="Description"></div><button type="submit">Save Store</button><button type="button" id="cancelStoreEdit" style="display:none;">Cancel</button></form></div><div class="card"><h3>All Stores</h3><input type="text" id="searchStore" class="search" placeholder="Search stores..."><div id="storeMessage"></div><div style="overflow-x:auto;"><table id="storesTable"><thead><tr><th>ID</th><th>Name</th><th>Category</th><th>Level</th><th>Wing</th><th>Emoji</th><th>Actions</th></tr></thead><tbody></tbody></table></div></div></div><div id="categories-tab" class="tab-content"><div class="card"><h3>Categories</h3><table id="categoriesTable"><thead><tr><th>ID</th><th>Name</th><th>Icon</th><th>Color Class</th></tr></thead><tbody></tbody></table></div></div><div id="wings-tab" class="tab-content"><div class="card"><h3>Wings</h3><table id="wingsTable"><thead><tr><th>ID</th><th>Name</th><th>Level</th><th>Description</th></tr></thead><tbody></tbody></table></div></div><div id="amenities-tab" class="tab-content"><div class="card"><h3>Amenities</h3><table id="amenitiesTable"><thead><tr><th>Name</th><th>Icon</th><th>Wing</th><th>Level</th><th>Description</th></tr></thead><tbody></tbody></table></div></div><div id="events-tab" class="tab-content"><div class="card"><h3>Current Events</h3><table id="eventsTable"><thead><tr><th>Title</th><th>Description</th><th>Store/Wing</th><th>Dates</th></tr></thead><tbody></tbody></table></div></div></div><script>let stores=[],categories=[],wings=[],amenities=[],events=[];let editStoreId=null;async function fetchAll(){const[sRes,cRes,wRes,aRes,eRes]=await Promise.all([fetch('/api/stores'),fetch('/api/categories'),fetch('/api/wings'),fetch('/api/amenities'),fetch('/api/events')]);stores=await sRes.json();categories=await cRes.json();wings=await wRes.json();amenities=await aRes.json();events=await eRes.json();populateSelects();renderStores();renderCategories();renderWings();renderAmenities();renderEvents();}function populateSelects(){const catSel=document.getElementById('category_id');catSel.innerHTML='<option value="">Select</option>'+categories.map(c=>`<option value="${c.id}">${c.icon||''} ${c.name}</option>`).join('');const wingSel=document.getElementById('wing_id');wingSel.innerHTML='<option value="">Select</option>'+wings.map(w=>`<option value="${w.id}">${w.name} (L${w.level_id})</option>`).join('');}function renderStores(){const searchTerm=document.getElementById('searchStore').value.toLowerCase();const filtered=stores.filter(s=>s.name.toLowerCase().includes(searchTerm)||s.id.toLowerCase().includes(searchTerm));const tbody=document.querySelector('#storesTable tbody');tbody.innerHTML=filtered.map(s=>`<tr><td>${escapeHtml(s.id)}</td><td>${escapeHtml(s.name)}</td><td>${escapeHtml(s.category_name)}</td><td>${s.level_id}</td><td>${escapeHtml(s.wing_name)}</td><td>${s.emoji}</td><td class="actions"><button class="edit-btn" onclick="editStore('${s.id}')">Edit</button><button class="delete-btn" onclick="deleteStore('${s.id}')">Delete</button></td></tr>`).join('');}function renderCategories(){document.querySelector('#categoriesTable tbody').innerHTML=categories.map(c=>`<tr><td>${c.id}</td><td>${c.name}</td><td>${c.icon||''}</td><td>${c.color_class||''}</td></tr>`).join('');}function renderWings(){document.querySelector('#wingsTable tbody').innerHTML=wings.map(w=>`<tr><td>${w.id}</td><td>${w.name}</td><td>L${w.level_id}</td><td>${w.description||''}</td></tr>`).join('');}function renderAmenities(){document.querySelector('#amenitiesTable tbody').innerHTML=amenities.map(a=>`<tr><td>${a.name}</td><td>${a.icon||''}</td><td>${a.wing_name||''}</td><td>L${a.level_id}</td><td>${a.description||''}</td></tr>`).join('');}function renderEvents(){document.querySelector('#eventsTable tbody').innerHTML=events.map(e=>`<tr><td>${e.title}</td><td>${e.description||''}</td><td>${e.store_name||e.wing_name||'Mall-wide'}</td><td>${new Date(e.start_date).toLocaleDateString()} - ${new Date(e.end_date).toLocaleDateString()}</td></tr>`).join('');}function showTab(tab){document.querySelectorAll('.tab-content').forEach(el=>el.classList.remove('active'));document.querySelectorAll('.tab').forEach(el=>el.classList.remove('active'));document.getElementById(`${tab}-tab`).classList.add('active');event.target.classList.add('active');}document.getElementById('storeForm').addEventListener('submit',async(e)=>{e.preventDefault();const payload={id:document.getElementById('store_id').value.trim(),name:document.getElementById('store_name').value.trim(),category_id:parseInt(document.getElementById('category_id').value),level_id:parseInt(document.getElementById('level_id').value),wing_id:document.getElementById('wing_id').value,emoji:document.getElementById('emoji').value.trim(),cc:document.getElementById('cc').value,ibg:document.getElementById('ibg').value,description:document.getElementById('store_description').value};const url=editStoreId?`/api/stores/${editStoreId}`:'/api/stores';const method=editStoreId?'PUT':'POST';const res=await fetch(url,{method,headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});if(res.ok){alert('Saved');window.location.reload();}else alert('Error saving store');});async function editStore(id){const s=stores.find(x=>x.id===id);if(!s)return;editStoreId=id;document.getElementById('store_id').value=s.id;document.getElementById('store_id').disabled=true;document.getElementById('store_name').value=s.name;document.getElementById('category_id').value=s.category_id;document.getElementById('level_id').value=s.level_id;document.getElementById('wing_id').value=s.wing_id;document.getElementById('emoji').value=s.emoji;document.getElementById('cc').value=s.cc||'';document.getElementById('ibg').value=s.ibg||'#FDF8EE';document.getElementById('store_description').value=s.description||'';document.getElementById('cancelStoreEdit').style.display='inline-block';}document.getElementById('cancelStoreEdit').addEventListener('click',()=>{editStoreId=null;document.getElementById('store_id').disabled=false;document.getElementById('storeForm').reset();document.getElementById('cancelStoreEdit').style.display='none';});async function deleteStore(id){if(confirm('Delete store?')){await fetch(`/api/stores/${id}`,{method:'DELETE'});window.location.reload();}}document.getElementById('searchStore').addEventListener('input',renderStores);function escapeHtml(str){return String(str).replace(/[&<>]/g,function(m){if(m==='&')return'&amp;';if(m==='<')return'&lt;';if(m==='>')return'&gt;';return m;});}fetchAll();</script></body></html>
