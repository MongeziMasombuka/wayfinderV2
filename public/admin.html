<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Admin - Grand Atrium</title>
    <link rel="stylesheet" href="/css/admin.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  </head>
  <body>
    <div class="container">
      <h1>🏛 Grand Atrium Admin Panel</h1>
      <div class="tabs">
        <div class="tab active" onclick="showTab('stores')">Stores</div>
        <div class="tab" onclick="showTab('categories')">Categories</div>
        <div class="tab" onclick="showTab('wings')">Wings</div>
        <div class="tab" onclick="showTab('amenities')">Amenities</div>
      </div>
      <div id="stores-tab" class="tab-content active">
        <div class="card">
          <h3>Add / Edit Store</h3>
          <form id="storeForm">
            <div class="form-grid">
              <input
                type="text"
                id="store_id"
                placeholder="Store ID"
                required
              />
              <input
                type="text"
                id="store_name"
                placeholder="Store Name"
                required
              />
              <select id="category_id" required>
                <option value="">Category</option>
              </select>
              <select id="level_id" required>
                <option value="1">Level 1</option>
                <option value="2">Level 2</option>
              </select>
              <select id="wing_id" required>
                <option value="">Wing</option>
              </select>
              <input type="text" id="emoji" placeholder="Emoji" required />
              <input type="text" id="cc" placeholder="Chip class" />
              <input type="color" id="ibg" value="#FDF8EE" />
              <input
                type="text"
                id="store_description"
                placeholder="Description"
              />
            </div>
            <button type="submit">Save Store</button>
            <button type="button" id="cancelStoreEdit" style="display: none">
              Cancel
            </button>
          </form>
        </div>
        <div class="card">
          <h3>All Stores</h3>
          <input
            type="text"
            id="searchStore"
            class="search"
            placeholder="Search stores..."
          />
          <div id="storeMessage"></div>
          <div style="overflow-x: auto">
            <table id="storesTable">
              <thead>
                <tr>
                  <th>ID</th>
                  <th>Name</th>
                  <th>Category</th>
                  <th>Level</th>
                  <th>Wing</th>
                  <th>Emoji</th>
                  <th>Actions</th>
                </tr>
              </thead>
              <tbody></tbody>
            </table>
          </div>
        </div>
      </div>
      <div id="categories-tab" class="tab-content">
        <div class="card">
          <h3>Categories</h3>
          <table id="categoriesTable">
            <thead>
              <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Icon</th>
                <th>Color Class</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
      </div>
      <div id="wings-tab" class="tab-content">
        <div class="card">
          <h3>Wings</h3>
          <table id="wingsTable">
            <thead>
              <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Level</th>
                <th>Description</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
      </div>
      <div id="amenities-tab" class="tab-content">
        <div class="card">
          <h3>Amenities</h3>
          <table id="amenitiesTable">
            <thead>
              <tr>
                <th>Name</th>
                <th>Icon</th>
                <th>Wing</th>
                <th>Level</th>
                <th>Description</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
      </div>
    </div>

    <!-- QR Modal -->
    <div class="qr-modal" id="qr-modal" onclick="closeQrModal()">
      <div class="qr-box" onclick="event.stopPropagation()">
        <div class="qr-box-top">
          <div class="qr-store-info">
            <div class="qr-emoji" id="qr-modal-emoji"></div>
            <div class="qr-name" id="qr-modal-name"></div>
            <div class="qr-meta" id="qr-modal-meta"></div>
            <div class="qr-id" id="qr-modal-id"></div>
          </div>
          <button class="qr-close-btn" onclick="closeQrModal()">✕</button>
        </div>
        <div class="qr-code-wrap" id="qr-code-wrap"></div>
      </div>
    </div>

    <script src="/js/admin.js"></script>
  </body>
</html>
